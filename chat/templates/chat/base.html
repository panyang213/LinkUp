{% load static %}<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}LinkUp{% endblock %}</title>
  <script>
    // Apply saved theme before paint (only the theme choice is stored, never chat data).
    (function () {
      var t = null;
      try { t = localStorage.getItem("linkup-theme"); } catch (e) {}
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-bs-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'chat/css/app.css' %}" rel="stylesheet">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="visually-hidden-focusable skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="{% url 'landing' %}" aria-label="LinkUp home">
      <span class="brand-mark" aria-hidden="true"></span>LinkUp
    </a>
    <div class="topbar-actions">
      <span class="online-pill" title="People online right now">
        <span class="dot dot-live" aria-hidden="true"></span>
        <span data-online-count>{{ online }}</span> online
      </span>
      <button class="icon-btn" type="button" id="theme-toggle" aria-label="Toggle dark mode">
        <i class="bi bi-moon-stars theme-icon-light"></i><i class="bi bi-sun theme-icon-dark"></i>
      </button>
      {% block topbar_extra %}{% endblock %}
    </div>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'chat/js/theme.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
