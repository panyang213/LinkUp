{% extends "chat/app_base.html" %}
{% load static %}
{% block title %}Friends · LinkUp{% endblock %}
{% block app_content %}
<h1 class="panel-title">Friends</h1>
<ul class="nav nav-pills lu-tabs mb-3" role="tablist">
  <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-friends" type="button" role="tab">Friends <span class="muted" id="n-friends"></span></button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-requests" type="button" role="tab">Requests <b class="count" id="n-requests" hidden></b></button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-find" type="button" role="tab" id="find-tab">Find people</button></li>
</ul>
<div class="tab-content">
  <div class="tab-pane fade show active" id="tab-friends" role="tabpanel"><div id="friends-list" class="stack"></div></div>
  <div class="tab-pane fade" id="tab-requests" role="tabpanel">
    <h2 class="card-title-lu">Received</h2><div id="incoming-list" class="stack mb-4"></div>
    <h2 class="card-title-lu">Sent</h2><div id="outgoing-list" class="stack"></div>
  </div>
  <div class="tab-pane fade" id="tab-find" role="tabpanel">
    <label class="form-label" for="search-input">Search by nickname</label>
    <input id="search-input" class="form-control mb-3" placeholder="At least 2 letters" autocomplete="off" maxlength="20">
    <div id="search-results" class="stack"></div>
  </div>
</div>
{% endblock %}
{% block page_scripts %}<script src="{% static 'chat/js/friends.js' %}"></script>{% endblock %}
